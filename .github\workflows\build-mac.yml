name: Build LoyerPay macOS (.dmg)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dependances
        run: npm install

      - name: Compiler le .dmg
        run: npm run build:mac

      - name: Mettre le .dmg a disposition au telechargement
        uses: actions/upload-artifact@v4
        with:
          name: LoyerPay-Mac-dmg
          path: dist/*.dmg
          retention-days: 30
